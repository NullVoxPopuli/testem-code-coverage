name: Coverage Comment

# Posts (or updates) a PR comment linking to the coverage-report artifacts
# uploaded by CI. This runs on workflow_run because pull_request runs from
# forks get a read-only GITHUB_TOKEN and cannot comment. The workflow
# executes no code from the PR — no checkout, only GitHub API calls — so the
# elevated token is safe here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Link coverage artifacts
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;

            // workflow_run.pull_requests is empty for fork PRs — resolve the
            // PR from the head SHA instead.
            let prNumber = run.pull_requests[0]?.number;
            if (!prNumber) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: run.head_sha,
                });
              prNumber = prs.find((pr) => pr.head.sha === run.head_sha)?.number;
            }
            if (!prNumber) {
              core.info(`No PR found for ${run.head_sha} — skipping.`);
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              },
            );
            const coverage = artifacts
              .filter((a) => a.name.startsWith('coverage-') && !a.expired)
              .sort((a, b) => a.name.localeCompare(b.name));
            if (coverage.length === 0) {
              core.info('No coverage artifacts on this run — skipping.');
              return;
            }

            const rows = coverage.map((a) => {
              const scenario = a.name.replace(/^coverage-/, '');
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${a.id}`;
              return `| ${scenario} | [${a.name}.zip](${url}) |`;
            });

            const marker = '<!-- coverage-reports-comment -->';
            const body = [
              marker,
              '## Coverage reports',
              '',
              '| Scenario | Artifact |',
              '| --- | --- |',
              ...rows,
              '',
              'Each artifact is the scenario\'s `coverage/` folder (HTML report, text/JSON summaries, raw V8 snapshot). Unzip and open `index.html`.',
              '',
              `From [this CI run](${run.html_url}) for ${run.head_sha}.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
