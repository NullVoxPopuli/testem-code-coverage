name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - run: pnpm format:check
      - run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - name: Upload coverage report (vite-app-js)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-vite-app-js
          path: test-scenarios/vite-app-js/coverage
          if-no-files-found: ignore
      - name: Upload coverage report (v2-addon-js)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-v2-addon-js
          path: test-scenarios/v2-addon-js/coverage
          if-no-files-found: ignore
      - name: Upload coverage report (vite-app-using-v2-addon-js)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-vite-app-using-v2-addon-js
          path: test-scenarios/vite-app-using-v2-addon-js/coverage
          if-no-files-found: ignore
      # The parallel scenario reuses the vite-app-js app but writes to its own
      # folder, so it needs its own artifact rather than folding into the one above.
      - name: Upload coverage report (vite-app-js, parallel browsers)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-vite-app-js-parallel
          path: test-scenarios/vite-app-js/coverage-parallel
          if-no-files-found: ignore
      - name: Show coverage error log (on failure)
        if: failure()
        run: |
          for SCENARIO in vite-app-js v2-addon-js vite-app-using-v2-addon-js; do
            LOG=test-scenarios/$SCENARIO/coverage/errors.log
            if [ -f "$LOG" ]; then
              echo "=== $LOG ==="
              cat "$LOG"
            else
              echo "(no $LOG found)"
            fi
            DIAG=test-scenarios/$SCENARIO/coverage/coverage-debug.log
            if [ -f "$DIAG" ]; then
              echo "=== $DIAG ==="
              cat "$DIAG"
            else
              echo "(no $DIAG found)"
            fi
          done
